name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-docs:
    name: Harness Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run harness check
        run: npm run harness:check
      - name: Run harness refresh
        run: npm run harness:refresh
      - name: Verify generated snapshot is committed
        run: git diff --exit-code -- docs/harness/generated/workspace-snapshot.md

  rn-tests:
    name: RN Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install JS dependencies
        run: yarn install --frozen-lockfile
      - name: Run Jest
        run: npm test -- --runInBand

  android-quality:
    name: Android Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install JS dependencies
        run: yarn install --frozen-lockfile
      - name: Make Gradle executable
        run: chmod +x android/gradlew
      - name: Run Android JVM and lint gates
        working-directory: android
        run: ./gradlew app:testDebugUnitTest app:lintDebug app:compileDebugAndroidTestKotlin :macrobenchmark:assemble
      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-reports
          path: |
            android/app/build/reports
            android/app/build/test-results
            android/macrobenchmark/build/reports
          if-no-files-found: ignore

  android-smoke:
    name: Android Smoke
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install JS dependencies
        run: yarn install --frozen-lockfile
      - name: Make Gradle executable
        run: chmod +x android/gradlew
      - name: Run connected smoke suite on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_6
          script: |
            cd android
            ./gradlew app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.novel.page.home.HomeSmokeTest,com.novel.page.login.LoginSmokeTest,com.novel.page.search.SearchSmokeTest,com.novel.page.read.viewmodel.ReaderSmokeTest
      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-reports
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
          if-no-files-found: ignore

  rn-lint-observe:
    name: RN Lint Observe
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install JS dependencies
        run: yarn install --frozen-lockfile
      - name: Run ESLint
        run: npm run lint

  android-detekt-observe:
    name: Android Detekt Observe
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install JS dependencies
        run: yarn install --frozen-lockfile
      - name: Make Gradle executable
        run: chmod +x android/gradlew
      - name: Run Detekt
        working-directory: android
        run: ./gradlew app:detekt
      - name: Upload Detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-detekt-reports
          path: |
            android/app/build/reports/detekt
          if-no-files-found: ignore
