plugins {
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.21'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.0.21'
    id("com.google.dagger.hilt.android")
    id 'io.gitlab.arturbosch.detekt' version '1.23.4'
}

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.devtools.ksp"
apply plugin: "kotlin-kapt"
apply plugin: "androidx.baselineprofile"

// 应用版本管理
apply from: '../versioning.gradle'
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Phase 1: release 构建开启代码压缩与资源收缩，逐步逼近生产配置。
 */
def enableProguardInReleaseBuilds = true
def configuredApiBaseHost = (project.findProperty("NOVEL_API_BASE_HOST") ?: System.getenv("NOVEL_API_BASE_HOST"))?.toString()?.trim()
def debugFallbackApiBaseHost = "http://47.110.147.60:8080"
def hasExternalApiBaseHost = configuredApiBaseHost != null && !configuredApiBaseHost.isEmpty()
def welfareDefaultUrl = "https://www.bing.com/"

def normalizeApiBaseHost = { host ->
    def normalized = host?.trim()
    if (!normalized) {
        return ""
    }
    normalized.endsWith("/") ? normalized[0..-2] : normalized
}

def buildApiConfig = { host ->
    def normalizedHost = normalizeApiBaseHost(host)
    [
            API_BASE_HOST        : normalizedHost,
            API_BASE_URL_FRONT   : normalizedHost ? "${normalizedHost}/api/front/" : "",
            API_BASE_URL_USER    : normalizedHost ? "${normalizedHost}/api/front/user/" : "",
            API_BASE_URL_RESOURCE: normalizedHost ? "${normalizedHost}/api/front/resource/" : "",
            API_BASE_URL_AUTHOR  : normalizedHost ? "${normalizedHost}/api/author/" : "",
            API_BASE_URL_AI      : normalizedHost ? "${normalizedHost}/api/author/ai/" : ""
    ]
}

def debugApiConfig = buildApiConfig(configuredApiBaseHost ?: debugFallbackApiBaseHost)
def releaseApiConfig = buildApiConfig(configuredApiBaseHost)
def releaseStoreFileProp = project.findProperty("NOVEL_RELEASE_STORE_FILE") ?: System.getenv("NOVEL_RELEASE_STORE_FILE")
def releaseStorePasswordProp = project.findProperty("NOVEL_RELEASE_STORE_PASSWORD") ?: System.getenv("NOVEL_RELEASE_STORE_PASSWORD")
def releaseKeyAliasProp = project.findProperty("NOVEL_RELEASE_KEY_ALIAS") ?: System.getenv("NOVEL_RELEASE_KEY_ALIAS")
def releaseKeyPasswordProp = project.findProperty("NOVEL_RELEASE_KEY_PASSWORD") ?: System.getenv("NOVEL_RELEASE_KEY_PASSWORD")
def hasReleaseSigning = [releaseStoreFileProp, releaseStorePasswordProp, releaseKeyAliasProp, releaseKeyPasswordProp].every {
    it != null && it.toString().trim()
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.novel"
    defaultConfig {
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        applicationId "com.novel"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        vectorDrawables.useSupportLibrary = true
        buildConfigField "String", "WELFARE_DEFAULT_URL", "\"${welfareDefaultUrl}\""
        buildConfigField "boolean", "HAS_EXTERNAL_API_BASE_HOST", hasExternalApiBaseHost ? "true" : "false"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFileProp)
                storePassword releaseStorePasswordProp
                keyAlias releaseKeyAliasProp
                keyPassword releaseKeyPasswordProp
            } else {
                initWith signingConfigs.debug
            }
        }
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
                "-Xno-param-assertions",
                "-Xno-call-assertions",
                // Compose编译器优化标志
                "-P",
                "plugin:androidx.compose.compiler.plugins.kotlin:featureFlag=OptimizeNonSkippingGroups",
                "-P", 
                "plugin:androidx.compose.compiler.plugins.kotlin:featureFlag=StrongSkipping",
                "-P",
                "plugin:androidx.compose.compiler.plugins.kotlin:featureFlag=IntrinsicRemember"
        ]
    }
    
    composeOptions {
        // 启用Compose编译器优化标志
        kotlinCompilerExtensionVersion = "1.5.14"
        useLiveLiterals = false  // 生产环境禁用LiveLiterals提升性能
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debugApiConfig.each { fieldName, fieldValue ->
                buildConfigField "String", fieldName, "\"${fieldValue}\""
            }
            buildConfigField "boolean", "ENABLE_LOGGING", "true"
        }
        release {
//            ndk{
//                abiFilters "armeabi-v7a"
//            }
            // Phase 1: 若已提供正式签名参数则使用 release signing，否则暂时回退到 debug signing 以保持本地可构建。
            signingConfig signingConfigs.release
            releaseApiConfig.each { fieldName, fieldValue ->
                buildConfigField "String", fieldName, "\"${fieldValue}\""
            }
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            buildConfigField "boolean", "ENABLE_LOGGING", "false"
        }
    }
    
    // 启用 buildFeatures
    buildFeatures {
        buildConfig = true
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

// Detekt 配置
detekt {
    toolVersion = "1.23.4"
    config.setFrom(file("../detekt.yml"))
    buildUponDefaultConfig = true
    
    reports {
        html.required = true
        xml.required = false
        txt.required = false
        sarif.required = false
        md.required = false
    }
}

