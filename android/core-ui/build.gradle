plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

apply from: rootProject.file("gradle/android-library-common.gradle")

android {
    namespace "com.novel.core.ui"
    configureNovelAndroidLibrary(delegate, true)
}

dependencies {
    implementation project(':core-common')

    implementation "androidx.core:core-ktx:1.16.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.0"
    implementation "androidx.compose.runtime:runtime:1.8.2"
    implementation "androidx.compose.ui:ui:1.8.2"
    implementation "androidx.compose.ui:ui-graphics:1.8.2"
    implementation "androidx.compose.foundation:foundation:1.8.2"
    implementation "androidx.compose.material3:material3-android:1.3.2"
    implementation "androidx.compose.material:material-icons-extended:1.7.6"
    implementation "com.facebook.react:react-android"
    implementation "org.jetbrains.kotlinx:kotlinx-collections-immutable:0.3.5"

    testImplementation "junit:junit:4.13.2"
    testImplementation "com.google.truth:truth:1.4.4"
}
