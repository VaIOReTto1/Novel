plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.dagger.hilt.android'
    id 'kotlin-kapt'
}

apply from: rootProject.file("gradle/android-library-common.gradle")

android {
    namespace "com.novel.feature.rnhost"
    configureNovelAndroidLibrary(delegate, true)

    defaultConfig {
        buildConfigField "boolean", "REFACTOR_ENABLE_BRIDGE_ERROR_MAPPER", "true"
        buildConfigField "boolean", "REFACTOR_ENABLE_BRIDGE_SHARED_SCOPES", "true"
        buildConfigField "boolean", "REFACTOR_ENABLE_SETTINGS_DATASTORE_PILOT", "false"
    }
}

dependencies {
    implementation project(':core-common')
    implementation project(':core-bridge')
    implementation project(':core-ui')
    implementation project(':core-storage')
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.compose.foundation:foundation:1.8.2"
    implementation "androidx.compose.ui:ui:1.8.2"
    implementation "androidx.compose.material3:material3-android:1.3.2"
    implementation "androidx.compose.runtime:runtime:1.8.2"
    implementation "androidx.datastore:datastore-preferences:1.2.1"
    implementation "androidx.work:work-runtime-ktx:2.10.2"
    implementation "org.jetbrains.kotlinx:kotlinx-collections-immutable:0.3.5"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.5.0"
    implementation("com.facebook.react:react-android")
    implementation "com.google.dagger:hilt-android:2.52"
    kapt "com.google.dagger:hilt-compiler:2.52"

    testImplementation "junit:junit:4.13.2"
    testImplementation "com.google.truth:truth:1.4.4"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0"
}
