plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

apply from: rootProject.file("gradle/android-library-common.gradle")

android {
    namespace "com.novel.feature.welfare"
    configureNovelAndroidLibrary(delegate, true)

    defaultConfig {
        buildConfigField "String", "WELFARE_DEFAULT_URL", "\"https://www.bing.com/\""
    }
}

dependencies {
    implementation project(':core-common')
    implementation "androidx.compose.runtime:runtime:1.8.2"
    implementation "androidx.compose.ui:ui:1.8.2"
    implementation "androidx.compose.foundation:foundation:1.8.2"
    implementation "androidx.compose.material3:material3-android:1.3.2"
    implementation "androidx.compose.material:material-icons-extended:1.7.6"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.0"
    implementation "androidx.webkit:webkit:1.8.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.9.0"

    testImplementation "junit:junit:4.13.2"
    testImplementation "com.google.truth:truth:1.4.4"
}
