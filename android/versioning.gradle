// android/versioning.gradle

// 加载版本属性文件
def versionPropsFile = file('../version.properties')

// 确保版本文件存在
if (!versionPropsFile.exists()) {
    throw new GradleException("版本文件未找到: ${versionPropsFile.absolutePath}。请先创建该文件。")
}

// 读取版本属性
def versionProps = new Properties()
versionProps.load(new FileInputStream(versionPropsFile))

// 定义版本变量
def versionCode = versionProps['VERSION_CODE'].toInteger()
def versionMajor = versionProps['VERSION_MAJOR'].toInteger()
def versionMinor = versionProps['VERSION_MINOR'].toInteger()
def versionPatch = versionProps['VERSION_PATCH'].toInteger()

// 计算 versionName
def versionName = "${versionMajor}.${versionMinor}.${versionPatch}"

// 将版本信息添加到 ext 属性中，方便在其他 build.gradle 文件中引用
ext {
    appVersionCode = versionCode
    appVersionName = versionName
}

// ======================================================================
//  版本号递增任务
// ======================================================================

task('incrementVersionCode', group: 'Versioning', description: '递增 versionCode') {
    doLast {
        versionProps['VERSION_CODE'] = (versionCode + 1).toString()
        versionProps.store(versionPropsFile.newWriter(), "版本属性 - versionCode已递增")
        println "✅ versionCode 已递增至: ${versionProps['VERSION_CODE']}"
    }
}

task('incrementPatch', group: 'Versioning', description: '递增 patch 版本号') {
    doLast {
        versionProps['VERSION_PATCH'] = (versionPatch + 1).toString()
        versionProps.store(versionPropsFile.newWriter(), "版本属性 - patch已递增")
        println "✅ 版本号已更新为: ${versionMajor}.${versionMinor}.${versionProps['VERSION_PATCH']}"
    }
}

task('incrementMinor', group: 'Versioning', description: '递增 minor 版本号并重置后续版本号') {
    doLast {
        versionProps['VERSION_MINOR'] = (versionMinor + 1).toString()
        versionProps['VERSION_PATCH'] = "0"
        versionProps.store(versionPropsFile.newWriter(), "版本属性 - minor已递增")
        println "✅ 版本号已更新为: ${versionMajor}.${versionProps['VERSION_MINOR']}.${versionProps['VERSION_PATCH']}"
    }
}

task('incrementMajor', group: 'Versioning', description: '递增 major 版本号并重置后续版本号') {
    doLast {
        versionProps['VERSION_MAJOR'] = (versionMajor + 1).toString()
        versionProps['VERSION_MINOR'] = "0"
        versionProps['VERSION_PATCH'] = "0"
        versionProps.store(versionPropsFile.newWriter(), "版本属性 - major已递增")
        println "✅ 版本号已更新为: ${versionProps['VERSION_MAJOR']}.${versionProps['VERSION_MINOR']}.${versionProps['VERSION_PATCH']}"
    }
}

// 组合任务，方便在发布前调用
task('incrementVersion', group: 'Versioning', description: '递增版本号和版本代码', dependsOn: ['incrementVersionCode', 'incrementPatch']) {
    doLast {
        println "✅ 版本递增完成"
    }
}